name: Validación técnica
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # --- Versión pública estática (sin autenticación) ---
      - name: Sintaxis de JavaScript
        run: node --check src/app.js && node --check src-secure/app.js
      - name: Reconstruir datos y aplicación
        run: |
          python tools/generate_data.py
          python tools/build.py

      # --- Versión candidata con Supabase y RLS ---
      - name: Compilar la aplicación con control de acceso
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python tools/build_secure.py

      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Comprobación de seguridad del artefacto
        run: python tools/security_scan.py site-secure src-secure supabase tools
      - name: Estructura de migraciones SQL
        run: |
          test -d supabase/migrations
          ls supabase/migrations/*.sql | sort -c
      - name: Reproducibilidad (lo reconstruido coincide con lo versionado)
        run: git diff --exit-code -- data/demo_sales.csv site/index.html site-secure/index.html
      - name: Manifiesto de integridad
        run: python tools/verify_release.py

      # --- Pruebas adversariales reales (solo si existen credenciales de QA) ---
      - name: Pruebas adversariales de autorización
        if: ${{ vars.SUPABASE_URL != '' && secrets.KRITER_QA_USERS != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          KRITER_QA_USERS: ${{ secrets.KRITER_QA_USERS }}
        run: node tests/adversarial_http.mjs
