name: Validación técnica
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sintaxis de JavaScript
        run: node --check src/app.js
      - name: Reconstruir datos y aplicación
        run: |
          python tools/generate_data.py
          python tools/build.py
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Reproducibilidad (lo reconstruido coincide con lo versionado)
        run: git diff --exit-code -- data/demo_sales.csv site/index.html
      - name: Manifiesto de integridad
        run: python tools/verify_release.py
